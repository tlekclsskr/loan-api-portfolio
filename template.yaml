AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Loan API - Iac version (portfolio demo)

Resources:
  LoansTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: loans-iac
      PrimaryKey:
        Name: id
        Type: String
    
  LoanApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: loan-api-iac
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      CodeUri: ./src/
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref LoansTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LoansTable
      Events:
        ListCreate:
          Type: HttpApi
          Properties:
            Path: /loans
            Method: ANY
        GetUpdate:
          Type: HttpApi
          Properties:
            Path: /loans/{id}
            Method: ANY

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"